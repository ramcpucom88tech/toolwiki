<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5057632351845136"
          crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <link rel="icon" type="image/png" href="images/toolwiki-favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Toolwiki</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- MATRIX BACKGROUND (LOW Z-INDEX) -->
<canvas id="matrix" style="position:fixed; top:0; left:0; z-index:1;"></canvas>

<!-- BOOT OVERLAY (MID Z-INDEX) -->
<div id="boot-overlay" style="position:fixed; inset:0; z-index:100;">
  <div id="boot-text"></div>
</div>

<header style="position:relative; z-index:200;">
  <img id="toolwikiLogo" src="images/toolwiki-logo.png" alt="Toolwiki Logo" class="logo fade-in">

  <h1>Quick, free utilities for daily life</h1>
</header>

<main style="position:relative; z-index:200;">
  <div class="enter-container">
    <a onclick="playTransition()" class="enter-button">Enter</a>
  </div>
</main>

<footer style="position:relative; z-index:200;">
  <p>© <span id="year"></span> Toolwiki · Built for quick utility & ad-supported access.</p>
</footer>

<!-- FULLSCREEN TRANSITION VIDEO (TOP Z-INDEX) -->
<div id="transitionVideo" class="fixed inset-0 hidden bg-black z-[9999]">
  <video id="toolwikiTransition"
       class="w-full h-full object-cover"
       
       playsinline
       style="width:100vw; height:100vh; object-fit:cover;"> >
    <source src="transition.mp4" type="video/mp4">
  </video>
</div>

<script src="script.js"></script>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const symbols = ["</>", "{ }", "()", "[]", "UTIL", "SYS"];

const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle ="#38bdf8";
  ctx.font = fontSize + "px monospace";

  drops.forEach((y, i) => {
    const text = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(text, i * fontSize, y * fontSize);

    if (y * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  });
}

setInterval(drawMatrix, 50);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

<script>
const bootLines = [
  "Toolwiki Systems v3.2.1",
  "Initializing core utilities...",
  "Loading modules: [OK]",
  "Checking system integrity...",
  "Integrity check: PASSED",
  "Activating neon interface...",
  "Starting Toolwiki engine...",
  "Boot sequence complete."
];

let index = 0;
const bootText = document.getElementById("boot-text");
const bootOverlay = document.getElementById("boot-overlay");

function typeLine() {
  if (index < bootLines.length) {
    bootText.textContent += bootLines[index] + "\n";
    index++;
    setTimeout(typeLine, 400);
  } else {
    setTimeout(() => {
      bootOverlay.style.opacity = "0";
      bootOverlay.style.transition = "opacity 1s ease";

      setTimeout(() => {
        bootOverlay.style.display = "none";
      }, 1000);

    }, 800);
  }
}

typeLine();
</script>

<script>
  function playTransition() {
  // Hide the logo
  document.getElementById("toolwikiLogo").style.display = "none";

  // Hide matrix if needed
  // document.getElementById("matrix").style.display = "none";

  const overlay = document.getElementById("transitionVideo");
  const video = document.getElementById("toolwikiTransition");

  overlay.style.display = "block";
  video.play();

  video.onended = () => {
    window.location.href = "tools.html";
    };
  }
</script>

</body>
</html>
