  <meta charset="UTF-8">

          crossorigin="anonymous"></script>

  <!-- your other head tags -->
</head>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Toolwiki</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<canvas id="matrix"></canvas>

<div id="boot-overlay">
  <div id="boot-text"></div>
</div>

  
<header>
  <img src="images/toolwiki-logo.png" alt="Toolwiki Logo" class="logo fade-in">
  <h1>Quick, free utilities for daily life</h1>
</header>

<main>
  <div class="enter-container">
    <a onclick="playTransition()" class="enter-button">Enter</a>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Toolwiki · Built for quick utility & ad-supported access.</p>
</footer>


<!-- Transition Video Overlay MUST be here -->
<div id="transitionVideo" class="fixed inset-0 hidden bg-black z-[9999]">
  <video id="toolwikiTransition" class="w-full h-full object-cover" muted>
    <source src="transition.mp4" type="video/mp4">
  </video>
</div>

<script src="script.js"></script>





<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const symbols = ["</>", "{ }", "()", "[]", "UTIL", "SYS"];

const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle ="#38bdf8" ; /* Toolwiki neon blue */
  ctx.font = fontSize + "px monospace";

  drops.forEach((y, i) => {
    const text = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(text, i * fontSize, y * fontSize);

    if (y * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  });
}

setInterval(drawMatrix, 50);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>



<script>
const bootLines = [
  "Toolwiki Systems v3.2.1",
  "Initializing core utilities...",
  "Loading modules: [OK]",
  "Checking system integrity...",
  "Integrity check: PASSED",
  "Activating neon interface...",
  "Starting Toolwiki engine...",
  "Boot sequence complete."
];

let index = 0;
const bootText = document.getElementById("boot-text");
const bootOverlay = document.getElementById("boot-overlay");
const landingContent = document.querySelector(".landing-content");

function typeLine() {
  if (index < bootLines.length) {
    bootText.textContent += bootLines[index] + "\n";
    index++;
    setTimeout(typeLine, 400); // typing speed
  } else {
    setTimeout(() => {
      bootOverlay.style.opacity = "0";
      bootOverlay.style.transition = "opacity 1s ease";

      setTimeout(() => {
        bootOverlay.style.display = "none";
        landingContent.style.opacity = "1";
      }, 1000);

    }, 800);
  }
}

typeLine();
</script>





<script>
  function playTransition() {
    const overlay = document.getElementById("transitionVideo");
    const video = document.getElementById("toolwikiTransition");

    overlay.classList.remove("hidden");
    video.play();

    video.onended = () => {
      window.location.href = "tools.html";
    };
  }
</script>









</body>
