<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5057632351845136"
          crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <link rel="icon" type="image/png" href="images/toolwiki-favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Toolwiki</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- EVERYTHING THAT SHOULD DISAPPEAR GOES HERE -->
<div id="pageContent">

  <!-- BACKGROUND VIDEO -->
  <video id="backgroundVideo" autoplay muted loop playsinline>
    <source src="transition.mp4" type="video/mp4">
  </video>

  <!-- MATRIX CANVAS (OPTIONAL, HIDDEN BY CSS) -->
  <canvas id="matrix"></canvas>

  <!-- BOOT OVERLAY -->
  <div id="boot-overlay">
    <div id="boot-text"></div>
  </div>

  <!-- HEADER -->
  <header>
    
    
  </header>

  <!-- MAIN -->
  <main>
    <div class="enter-container">
      <a onclick="playTransition()" class="enter-button">ENTER</a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    
  </footer>

</div>

<!-- TRANSITION VIDEO OVERLAY -->
<div id="transitionVideo">
  <video id="toolwikiTransition" playsinline>
    <source src="Toolwiki_splash_1.mp4" type="video/mp4">
  </video>
</div>

<script src="script.js"></script>

<!-- MATRIX RAIN SCRIPT -->
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const symbols = ["</>", "{ }", "()", "[]", "UTIL", "SYS"];
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#38bdf8";
  ctx.font = fontSize + "px monospace";

  drops.forEach((y, i) => {
    const text = symbols[Math.floor(Math.random() * symbols.length)];
    ctx.fillText(text, i * fontSize, y * fontSize);

    if (y * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  });
}

setInterval(drawMatrix, 50);

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

<!-- BOOT SEQUENCE SCRIPT -->
<script>
const bootLines = [
  "Toolwiki Systems v3.2.1",
  "Initializing core utilities...",
  "Loading modules: [OK]",
  "Checking system integrity...",
  "Integrity check: PASSED",
  "Activating neon interface...",
  "Starting Toolwiki engine...",
  "Boot sequence complete."
];

let index = 0;
const bootText = document.getElementById("boot-text");
const bootOverlay = document.getElementById("boot-overlay");

function typeLine() {
  if (index < bootLines.length) {
    bootText.textContent += bootLines[index] + "\n";
    index++;
    setTimeout(typeLine, 400);
  } else {
    setTimeout(() => {
      bootOverlay.style.opacity = "0";
      bootOverlay.style.transition = "opacity 1s ease";

      setTimeout(() => {
        bootOverlay.style.display = "none";
      }, 1000);

    }, 800);
  }
}

typeLine();
</script>

<!-- TRANSITION SCRIPT -->
<script>
function playTransition() {

  // Hide EVERYTHING
  document.getElementById("pageContent").style.display = "none";

  // Show transition overlay
  const overlay = document.getElementById("transitionVideo");
  const video = document.getElementById("toolwikiTransition");

  overlay.style.display = "block";
  video.play();

  video.onended = () => {
    window.location.href = "tools.html";
  };
}
</script>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
